<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仓储管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            color: #666;
            border: none;
            background: none;
            font-size: 1rem;
        }

        .tab:hover {
            background: #e9ecef;
            color: #667eea;
        }

        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .tab-content {
            display: none;
            padding: 30px;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: #ffc107;
            color: #333;
        }

        .btn-warning:hover {
            background: #e0a800;
            transform: translateY(-2px);
        }

        .btn-sm {
            padding: 6px 15px;
            font-size: 0.875rem;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }

        th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.875rem;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .badge-success {
            background: #d4edda;
            color: #155724;
        }

        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }

        .badge-danger {
            background: #f8d7da;
            color: #721c24;
        }

        .badge-info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .stat-card p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #667eea;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }

        .close-btn:hover {
            color: #333;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }

        .action-buttons {
            display: flex;
            gap: 5px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .tabs {
                flex-direction: column;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 仓储管理系统</h1>
            <p>纯前端仓储管理解决方案 | 数据本地存储</p>
        </header>

        <div class="tabs">
            <button class="tab active" data-tab="products">商品管理</button>
            <button class="tab" data-tab="inventory">库存管理</button>
            <button class="tab" data-tab="inbound">入库记录</button>
            <button class="tab" data-tab="outbound">出库记录</button>
            <button class="tab" data-tab="statistics">统计分析</button>
        </div>

        <div id="products" class="tab-content active">
            <div class="form-row">
                <div class="form-group">
                    <label>商品名称</label>
                    <input type="text" id="productName" placeholder="请输入商品名称">
                </div>
                <div class="form-group">
                    <label>商品编码</label>
                    <input type="text" id="productCode" placeholder="请输入商品编码">
                </div>
                <div class="form-group">
                    <label>商品分类</label>
                    <select id="productCategory">
                        <option value="">请选择分类</option>
                        <option value="电子产品">电子产品</option>
                        <option value="服装鞋帽">服装鞋帽</option>
                        <option value="食品饮料">食品饮料</option>
                        <option value="家居用品">家居用品</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>单位</label>
                    <select id="productUnit">
                        <option value="件">件</option>
                        <option value="箱">箱</option>
                        <option value="个">个</option>
                        <option value="kg">kg</option>
                        <option value="g">g</option>
                        <option value="L">L</option>
                        <option value="ml">ml</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>单价 (元)</label>
                    <input type="number" id="productPrice" placeholder="请输入单价" step="0.01">
                </div>
                <div class="form-group">
                    <label>初始库存</label>
                    <input type="number" id="productStock" placeholder="请输入初始库存" min="0">
                </div>
                <div class="form-group">
                    <label>最小库存预警</label>
                    <input type="number" id="productMinStock" placeholder="请输入最小库存" min="0">
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end;">
                    <button class="btn btn-primary" onclick="addProduct()">➕ 添加商品</button>
                </div>
            </div>

            <div class="search-box">
                <input type="text" id="productSearch" placeholder="🔍 搜索商品名称或编码..." oninput="filterProducts()">
            </div>

            <div class="table-container">
                <table id="productsTable">
                    <thead>
                        <tr>
                            <th>编码</th>
                            <th>名称</th>
                            <th>分类</th>
                            <th>单价</th>
                            <th>库存</th>
                            <th>单位</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody">
                    </tbody>
                </table>
            </div>
        </div>

        <div id="inventory" class="tab-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3 id="totalProducts">0</h3>
                    <p>商品总数</p>
                </div>
                <div class="stat-card">
                    <h3 id="totalStock">0</h3>
                    <p>库存总量</p>
                </div>
                <div class="stat-card">
                    <h3 id="totalValue">¥0</h3>
                    <p>库存总值</p>
                </div>
                <div class="stat-card">
                    <h3 id="lowStockCount">0</h3>
                    <p>低库存商品</p>
                </div>
            </div>

            <div class="search-box">
                <input type="text" id="inventorySearch" placeholder="🔍 搜索库存..." oninput="filterInventory()">
            </div>

            <div class="table-container">
                <table id="inventoryTable">
                    <thead>
                        <tr>
                            <th>编码</th>
                            <th>名称</th>
                            <th>分类</th>
                            <th>当前库存</th>
                            <th>单位</th>
                            <th>单价</th>
                            <th>库存价值</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableBody">
                    </tbody>
                </table>
            </div>
        </div>

        <div id="inbound" class="tab-content">
            <div class="form-row">
                <div class="form-group">
                    <label>选择商品</label>
                    <select id="inboundProduct">
                        <option value="">请选择商品</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>入库数量</label>
                    <input type="number" id="inboundQuantity" placeholder="请输入入库数量" min="1">
                </div>
                <div class="form-group">
                    <label>入库类型</label>
                    <select id="inboundType">
                        <option value="采购入库">采购入库</option>
                        <option value="退货入库">退货入库</option>
                        <option value="生产入库">生产入库</option>
                        <option value="其他入库">其他入库</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <input type="text" id="inboundNote" placeholder="请输入备注">
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end;">
                    <button class="btn btn-success" onclick="addInbound()">📥 确认入库</button>
                </div>
            </div>

            <div class="table-container">
                <table id="inboundTable">
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>商品</th>
                            <th>数量</th>
                            <th>类型</th>
                            <th>备注</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="inboundTableBody">
                    </tbody>
                </table>
            </div>
        </div>

        <div id="outbound" class="tab-content">
            <div class="form-row">
                <div class="form-group">
                    <label>选择商品</label>
                    <select id="outboundProduct">
                        <option value="">请选择商品</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>出库数量</label>
                    <input type="number" id="outboundQuantity" placeholder="请输入出库数量" min="1">
                </div>
                <div class="form-group">
                    <label>出库类型</label>
                    <select id="outboundType">
                        <option value="销售出库">销售出库</option>
                        <option value="领用出库">领用出库</option>
                        <option value="报废出库">报废出库</option>
                        <option value="其他出库">其他出库</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <input type="text" id="outboundNote" placeholder="请输入备注">
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end;">
                    <button class="btn btn-danger" onclick="addOutbound()">📤 确认出库</button>
                </div>
            </div>

            <div class="table-container">
                <table id="outboundTable">
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>商品</th>
                            <th>数量</th>
                            <th>类型</th>
                            <th>备注</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="outboundTableBody">
                    </tbody>
                </table>
            </div>
        </div>

        <div id="statistics" class="tab-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3 id="statTotalProducts">0</h3>
                    <p>商品总数</p>
                </div>
                <div class="stat-card">
                    <h3 id="statTotalStock">0</h3>
                    <p>库存总量</p>
                </div>
                <div class="stat-card">
                    <h3 id="statTotalValue">¥0</h3>
                    <p>库存总值</p>
                </div>
                <div class="stat-card">
                    <h3 id="statInboundCount">0</h3>
                    <p>入库次数</p>
                </div>
                <div class="stat-card">
                    <h3 id="statOutboundCount">0</h3>
                    <p>出库次数</p>
                </div>
                <div class="stat-card">
                    <h3 id="statLowStock">0</h3>
                    <p>低库存商品</p>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>按分类统计</label>
                    <select id="categoryFilter" onchange="updateCategoryStats()">
                        <option value="">全部分类</option>
                        <option value="电子产品">电子产品</option>
                        <option value="服装鞋帽">服装鞋帽</option>
                        <option value="食品饮料">食品饮料</option>
                        <option value="家居用品">家居用品</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
            </div>

            <div class="table-container">
                <table id="categoryStatsTable">
                    <thead>
                        <tr>
                            <th>分类</th>
                            <th>商品数量</th>
                            <th>库存总量</th>
                            <th>库存价值</th>
                        </tr>
                    </thead>
                    <tbody id="categoryStatsBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>编辑商品</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>商品名称</label>
                <input type="text" id="editProductName">
            </div>
            <div class="form-group">
                <label>商品编码</label>
                <input type="text" id="editProductCode">
            </div>
            <div class="form-group">
                <label>商品分类</label>
                <select id="editProductCategory">
                    <option value="电子产品">电子产品</option>
                    <option value="服装鞋帽">服装鞋帽</option>
                    <option value="食品饮料">食品饮料</option>
                    <option value="家居用品">家居用品</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label>单位</label>
                <select id="editProductUnit">
                    <option value="件">件</option>
                    <option value="箱">箱</option>
                    <option value="个">个</option>
                    <option value="kg">kg</option>
                    <option value="g">g</option>
                    <option value="L">L</option>
                    <option value="ml">ml</option>
                </select>
            </div>
            <div class="form-group">
                <label>单价 (元)</label>
                <input type="number" id="editProductPrice" step="0.01">
            </div>
            <div class="form-group">
                <label>最小库存预警</label>
                <input type="number" id="editProductMinStock" min="0">
            </div>
            <div class="modal-footer">
                <button class="btn btn-warning" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveProduct()">保存</button>
            </div>
        </div>
    </div>

    <script>
        let products = [];
        let inboundRecords = [];
        let outboundRecords = [];
        let editingProductId = null;

        const STORAGE_KEY = 'warehouseData';

        function loadData() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                const parsed = JSON.parse(data);
                products = parsed.products || [];
                inboundRecords = parsed.inboundRecords || [];
                outboundRecords = parsed.outboundRecords || [];
            }
        }

        function saveData() {
            const data = {
                products,
                inboundRecords,
                outboundRecords
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function formatDate(date) {
            return new Date(date).toLocaleString('zh-CN');
        }

        function formatPrice(price) {
            return '¥' + parseFloat(price).toFixed(2);
        }

        function getStockStatus(product) {
            if (product.stock === 0) {
                return '<span class="badge badge-danger">缺货</span>';
            } else if (product.stock <= product.minStock) {
                return '<span class="badge badge-warning">低库存</span>';
            } else {
                return '<span class="badge badge-success">正常</span>';
            }
        }

        function addProduct() {
            const name = document.getElementById('productName').value.trim();
            const code = document.getElementById('productCode').value.trim();
            const category = document.getElementById('productCategory').value;
            const unit = document.getElementById('productUnit').value;
            const price = parseFloat(document.getElementById('productPrice').value);
            const stock = parseInt(document.getElementById('productStock').value) || 0;
            const minStock = parseInt(document.getElementById('productMinStock').value) || 0;

            if (!name || !code || !category || !price) {
                alert('请填写完整信息！');
                return;
            }

            if (products.find(p => p.code === code)) {
                alert('商品编码已存在！');
                return;
            }

            const product = {
                id: generateId(),
                name,
                code,
                category,
                unit,
                price,
                stock,
                minStock,
                createdAt: new Date().toISOString()
            };

            products.push(product);
            saveData();
            renderProducts();
            renderInventory();
            updateStatistics();
            clearProductForm();
        }

        function clearProductForm() {
            document.getElementById('productName').value = '';
            document.getElementById('productCode').value = '';
            document.getElementById('productCategory').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productStock').value = '';
            document.getElementById('productMinStock').value = '';
        }

        function editProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            editingProductId = id;
            document.getElementById('editProductName').value = product.name;
            document.getElementById('editProductCode').value = product.code;
            document.getElementById('editProductCategory').value = product.category;
            document.getElementById('editProductUnit').value = product.unit;
            document.getElementById('editProductPrice').value = product.price;
            document.getElementById('editProductMinStock').value = product.minStock;

            document.getElementById('editModal').classList.add('active');
        }

        function saveProduct() {
            const product = products.find(p => p.id === editingProductId);
            if (!product) return;

            const name = document.getElementById('editProductName').value.trim();
            const code = document.getElementById('editProductCode').value.trim();
            const category = document.getElementById('editProductCategory').value;
            const unit = document.getElementById('editProductUnit').value;
            const price = parseFloat(document.getElementById('editProductPrice').value);
            const minStock = parseInt(document.getElementById('editProductMinStock').value) || 0;

            if (!name || !code || !category || !price) {
                alert('请填写完整信息！');
                return;
            }

            const existingProduct = products.find(p => p.code === code && p.id !== editingProductId);
            if (existingProduct) {
                alert('商品编码已存在！');
                return;
            }

            product.name = name;
            product.code = code;
            product.category = category;
            product.unit = unit;
            product.price = price;
            product.minStock = minStock;

            saveData();
            renderProducts();
            renderInventory();
            updateStatistics();
            closeModal();
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
            editingProductId = null;
        }

        function deleteProduct(id) {
            if (!confirm('确定要删除这个商品吗？')) return;

            products = products.filter(p => p.id !== id);
            inboundRecords = inboundRecords.filter(r => r.productId !== id);
            outboundRecords = outboundRecords.filter(r => r.productId !== id);
            saveData();
            renderProducts();
            renderInventory();
            renderInbound();
            renderOutbound();
            updateStatistics();
        }

        function filterProducts() {
            const search = document.getElementById('productSearch').value.toLowerCase();
            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(search) || 
                p.code.toLowerCase().includes(search)
            );
            renderProductsTable(filtered);
        }

        function renderProducts() {
            renderProductsTable(products);
            updateProductSelects();
        }

        function renderProductsTable(productList) {
            const tbody = document.getElementById('productsTableBody');
            
            if (productList.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="empty-state">
                            <i>📦</i>
                            <p>暂无商品数据</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = productList.map(product => `
                <tr>
                    <td>${product.code}</td>
                    <td>${product.name}</td>
                    <td>${product.category}</td>
                    <td>${formatPrice(product.price)}</td>
                    <td>${product.stock}</td>
                    <td>${product.unit}</td>
                    <td>${getStockStatus(product)}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn btn-sm btn-warning" onclick="editProduct('${product.id}')">编辑</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteProduct('${product.id}')">删除</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function filterInventory() {
            const search = document.getElementById('inventorySearch').value.toLowerCase();
            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(search) || 
                p.code.toLowerCase().includes(search)
            );
            renderInventoryTable(filtered);
        }

        function renderInventory() {
            renderInventoryTable(products);
            updateInventoryStats();
        }

        function renderInventoryTable(productList) {
            const tbody = document.getElementById('inventoryTableBody');
            
            if (productList.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="empty-state">
                            <i>📊</i>
                            <p>暂无库存数据</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = productList.map(product => `
                <tr>
                    <td>${product.code}</td>
                    <td>${product.name}</td>
                    <td>${product.category}</td>
                    <td>${product.stock}</td>
                    <td>${product.unit}</td>
                    <td>${formatPrice(product.price)}</td>
                    <td>${formatPrice(product.stock * product.price)}</td>
                    <td>${getStockStatus(product)}</td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="quickInbound('${product.id}')">入库</button>
                        <button class="btn btn-sm btn-danger" onclick="quickOutbound('${product.id}')">出库</button>
                    </td>
                </tr>
            `).join('');
        }

        function updateInventoryStats() {
            const totalProducts = products.length;
            const totalStock = products.reduce((sum, p) => sum + p.stock, 0);
            const totalValue = products.reduce((sum, p) => sum + p.stock * p.price, 0);
            const lowStockCount = products.filter(p => p.stock <= p.minStock).length;

            document.getElementById('totalProducts').textContent = totalProducts;
            document.getElementById('totalStock').textContent = totalStock;
            document.getElementById('totalValue').textContent = formatPrice(totalValue);
            document.getElementById('lowStockCount').textContent = lowStockCount;
        }

        function updateProductSelects() {
            const inboundSelect = document.getElementById('inboundProduct');
            const outboundSelect = document.getElementById('outboundProduct');

            const options = '<option value="">请选择商品</option>' + 
                products.map(p => `<option value="${p.id}">${p.code} - ${p.name} (库存: ${p.stock})</option>`).join('');

            inboundSelect.innerHTML = options;
            outboundSelect.innerHTML = options;
        }

        function addInbound() {
            const productId = document.getElementById('inboundProduct').value;
            const quantity = parseInt(document.getElementById('inboundQuantity').value);
            const type = document.getElementById('inboundType').value;
            const note = document.getElementById('inboundNote').value;

            if (!productId || !quantity || quantity <= 0) {
                alert('请选择商品并输入有效数量！');
                return;
            }

            const product = products.find(p => p.id === productId);
            if (!product) return;

            product.stock += quantity;

            const record = {
                id: generateId(),
                productId,
                productName: product.name,
                productCode: product.code,
                quantity,
                type,
                note,
                createdAt: new Date().toISOString()
            };

            inboundRecords.unshift(record);
            saveData();
            renderProducts();
            renderInventory();
            renderInbound();
            updateStatistics();
            clearInboundForm();
        }

        function clearInboundForm() {
            document.getElementById('inboundProduct').value = '';
            document.getElementById('inboundQuantity').value = '';
            document.getElementById('inboundNote').value = '';
        }

        function deleteInbound(id) {
            if (!confirm('确定要删除这条入库记录吗？')) return;

            const record = inboundRecords.find(r => r.id === id);
            if (!record) return;

            const product = products.find(p => p.id === record.productId);
            if (product) {
                product.stock = Math.max(0, product.stock - record.quantity);
            }

            inboundRecords = inboundRecords.filter(r => r.id !== id);
            saveData();
            renderProducts();
            renderInventory();
            renderInbound();
            updateStatistics();
        }

        function renderInbound() {
            const tbody = document.getElementById('inboundTableBody');
            
            if (inboundRecords.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state">
                            <i>📥</i>
                            <p>暂无入库记录</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = inboundRecords.map(record => `
                <tr>
                    <td>${formatDate(record.createdAt)}</td>
                    <td>${record.productCode} - ${record.productName}</td>
                    <td class="badge badge-success">+${record.quantity}</td>
                    <td>${record.type}</td>
                    <td>${record.note || '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deleteInbound('${record.id}')">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        function addOutbound() {
            const productId = document.getElementById('outboundProduct').value;
            const quantity = parseInt(document.getElementById('outboundQuantity').value);
            const type = document.getElementById('outboundType').value;
            const note = document.getElementById('outboundNote').value;

            if (!productId || !quantity || quantity <= 0) {
                alert('请选择商品并输入有效数量！');
                return;
            }

            const product = products.find(p => p.id === productId);
            if (!product) return;

            if (product.stock < quantity) {
                alert('库存不足！当前库存: ' + product.stock);
                return;
            }

            product.stock -= quantity;

            const record = {
                id: generateId(),
                productId,
                productName: product.name,
                productCode: product.code,
                quantity,
                type,
                note,
                createdAt: new Date().toISOString()
            };

            outboundRecords.unshift(record);
            saveData();
            renderProducts();
            renderInventory();
            renderOutbound();
            updateStatistics();
            clearOutboundForm();
        }

        function clearOutboundForm() {
            document.getElementById('outboundProduct').value = '';
            document.getElementById('outboundQuantity').value = '';
            document.getElementById('outboundNote').value = '';
        }

        function deleteOutbound(id) {
            if (!confirm('确定要删除这条出库记录吗？')) return;

            const record = outboundRecords.find(r => r.id === id);
            if (!record) return;

            const product = products.find(p => p.id === record.productId);
            if (product) {
                product.stock += record.quantity;
            }

            outboundRecords = outboundRecords.filter(r => r.id !== id);
            saveData();
            renderProducts();
            renderInventory();
            renderOutbound();
            updateStatistics();
        }

        function renderOutbound() {
            const tbody = document.getElementById('outboundTableBody');
            
            if (outboundRecords.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state">
                            <i>📤</i>
                            <p>暂无出库记录</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = outboundRecords.map(record => `
                <tr>
                    <td>${formatDate(record.createdAt)}</td>
                    <td>${record.productCode} - ${record.productName}</td>
                    <td class="badge badge-danger">-${record.quantity}</td>
                    <td>${record.type}</td>
                    <td>${record.note || '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deleteOutbound('${record.id}')">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        function quickInbound(productId) {
            document.querySelector('[data-tab="inbound"]').click();
            document.getElementById('inboundProduct').value = productId;
            document.getElementById('inboundQuantity').focus();
        }

        function quickOutbound(productId) {
            document.querySelector('[data-tab="outbound"]').click();
            document.getElementById('outboundProduct').value = productId;
            document.getElementById('outboundQuantity').focus();
        }

        function updateStatistics() {
            const totalProducts = products.length;
            const totalStock = products.reduce((sum, p) => sum + p.stock, 0);
            const totalValue = products.reduce((sum, p) => sum + p.stock * p.price, 0);
            const inboundCount = inboundRecords.length;
            const outboundCount = outboundRecords.length;
            const lowStock = products.filter(p => p.stock <= p.minStock).length;

            document.getElementById('statTotalProducts').textContent = totalProducts;
            document.getElementById('statTotalStock').textContent = totalStock;
            document.getElementById('statTotalValue').textContent = formatPrice(totalValue);
            document.getElementById('statInboundCount').textContent = inboundCount;
            document.getElementById('statOutboundCount').textContent = outboundCount;
            document.getElementById('statLowStock').textContent = lowStock;

            updateCategoryStats();
        }

        function updateCategoryStats() {
            const categoryFilter = document.getElementById('categoryFilter').value;
            let filteredProducts = products;

            if (categoryFilter) {
                filteredProducts = products.filter(p => p.category === categoryFilter);
            }

            const categories = {};
            filteredProducts.forEach(product => {
                if (!categories[product.category]) {
                    categories[product.category] = {
                        count: 0,
                        stock: 0,
                        value: 0
                    };
                }
                categories[product.category].count++;
                categories[product.category].stock += product.stock;
                categories[product.category].value += product.stock * product.price;
            });

            const tbody = document.getElementById('categoryStatsBody');
            
            if (Object.keys(categories).length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="empty-state">
                            <i>📊</i>
                            <p>暂无统计数据</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = Object.entries(categories).map(([category, data]) => `
                <tr>
                    <td>${category}</td>
                    <td>${data.count}</td>
                    <td>${data.stock}</td>
                    <td>${formatPrice(data.value)}</td>
                </tr>
            `).join('');
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                this.classList.add('active');
                document.getElementById(this.dataset.tab).classList.add('active');
            });
        });

        loadData();
        renderProducts();
        renderInventory();
        renderInbound();
        renderOutbound();
        updateStatistics();
    </script>
</body>
</html>
